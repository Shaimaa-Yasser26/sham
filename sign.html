<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newsletter Sign Up - Sham</title>
<link rel="stylesheet" href="sign.css">
</head>


<body>

<button class="close-btn" onclick="closePopup()">&times;</button>

<div class="overlay" id="overlay">
  <div class="newsletter-popup">
   

    <h1>NEWSLETTER SIGN UP</h1>
    <p class="subtitle">Sign up for exclusive news and offers</p>

    <form id="newsletterForm">
      <div class="form-group">
        <label for="email">Email Address *</label>
        <input type="email" id="email" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName">
        </div>
        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob">
        </div>
        <div class="form-group">
          <label for="location">Favourite Location</label>
          <select id="location">
            <option value="">Select a location</option>
            <option value="cairo">Cairo</option>
            <option value="giza">Giza</option>
            <option value="alex">Alexandria</option>
          </select>
        </div>
      </div>
      <p class="hint">Tell us your birthday and we'll send you a treat on us</p>

      <div class="checkbox-group">
        <label for="optin">Opt in to our mailing list *</label>
        <input class="check" type="checkbox" id="optin" required>
      </div>

      <button type="submit" class="submit-btn">Submit</button>
    </form>
  </div>
</div>

<script src="sign.js"></script>
</body>
</html>
